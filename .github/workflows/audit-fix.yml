# Manually-triggered dependency patcher.
# Why this exists: the local dev machine sits behind a TLS-intercepting proxy
# whose npm registry mirror lags behind npmjs.org, so `npm audit fix` cannot
# resolve patched versions locally. This job runs it on GitHub's clean network
# and opens a PR with the refreshed lockfiles.
name: audit-fix

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit fix (server)
        working-directory: server
        run: |
          npm install --no-audit --no-fund
          npm audit fix || true
          npm audit --audit-level=high

      - name: Audit fix (client)
        working-directory: client
        run: |
          npm install --no-audit --no-fund
          npm audit fix || true
          npm audit --audit-level=high

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: fix/npm-audit
          title: "fix: bump vulnerable dependencies via npm audit fix"
          commit-message: "fix: bump vulnerable dependencies via npm audit fix"
          body: |
            Automated `npm audit fix` run from the audit-fix workflow.
            Lockfile-only bumps within existing semver ranges (axios, mongoose,
            express-rate-limit, resend, qs, uuid, ip-address, svix).
          add-paths: |
            server/package.json
            server/package-lock.json
            client/package.json
            client/package-lock.json
