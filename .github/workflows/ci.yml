name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (Vitest)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Run tests
        working-directory: server
        run: npm test

  dependency-audit:
    name: Dependency audit (ASVS 14.2.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # TEMPORARY: continue-on-error until the `audit-fix` workflow (workflow_dispatch)
      # has been run and its PR merged — see audit-fix.yml. Remove continue-on-error
      # once server/client package-lock.json no longer contain the flagged versions.
      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Audit client dependencies
        working-directory: client
        run: npm audit --audit-level=high
        continue-on-error: true
