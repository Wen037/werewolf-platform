version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: werewolf-mongo
    ports:
      - "27017:27017"
    volumes:
      # CHANGE THIS LINE:
      # Maps the folder "./mongo-data" in your project to the container
      - ./mongo-data:/data/db
    restart: always

  mongo-express:
    image: mongo-express
    container_name: werewolf-admin
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
    depends_on:
      - mongo

